experiment:
  name: full_daily
  seed: 42
  deterministic: true
  run_root: runs
  device: auto

data:
  source: csv
  prepared_cache: true
  prepared_cache_dir: data/prepared_cache
  input_path: data/raw/daily_panel.csv
  factor_path: data/raw/factors.csv
  horizon: 21
  embargo: 21
  graph_window: 126
  graph_refit_stride: 5
  graph_solver_max_iter: 500
  graph_solver_tolerance: 0.0001
  concept_scales: [5, 21, 63, 126]
  market_scale: 21
  train_fraction: 0.65
  val_fraction: 0.15
  ridge_alpha: 0.10
  graph_alpha: 0.03
  graph_alpha_selection: rolling_train
  graph_alpha_candidates: [0.01, 0.03, 0.10, 0.30]
  graph_alpha_selection_origins: 24
  graph_edge_stability_weight: 0.05
  graph_gate_center: 0.10
  graph_gate_temperature: 0.05
  projection_quantiles: [0.001, 0.999]
  projection_margin_fraction: 0.05
  graph_bound_quantile: 0.999
  graph_bound_margin_fraction: 0.05
  risk_free_column: risk_free
  risk_free_policy: require_column
  market_weight_policy: equal_weight
  order_flow_mode: daily_signed_dollar_volume_proxy

model:
  hidden_dim: 128
  lead_dim: 16
  graph_embedding_dim: 32
  delta: 0.20
  gamma_min: 0.10
  gamma_max: 1.00
  diffusion_max: 1.00
  force_max: 1.00
  graph_refresh: 0.10
  future_graph_gate_center: 0.10
  future_graph_gate_temperature: 0.05
  q_epsilon: 0.02
  nu_min: 2.10
  mean_bound_multiplier: 5.0
  scale_floor: 0.05
  risk_strength_max: 1.0
  residual_scale: 0.02

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  grad_clip: 1.0
  train_samples: 32
  eval_samples: 256
  validation_samples: 64
  test_samples: 256
  selection_metric: energy_score
  selection_min_delta: 0.000001
  evaluation_seed: 271828
  lambda_concept: 0.20
  lambda_graph: 0.05
  lambda_monotonicity: 0.02
  lambda_gain: 0.10
  gain_target: 0.995
  num_workers: 4

evaluation:
  alpha_levels: [0.50, 0.80, 0.95]
  transaction_cost_bps: 10.0
  top_fraction: 0.10
  empirical_certificate_iterations: 20
  empirical_certificate_max_states: 128
  empirical_certificate_batch_size: 16

figures:
  dpi: 200
  formats: [png, pdf]
