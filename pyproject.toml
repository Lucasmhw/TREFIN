[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f-concord"
version = "0.1.0"
description = "Reproducible implementation of F-CONCORD for interpretable probabilistic financial forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "F-CONCORD research implementation"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "torch>=2.2,<3",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "networkx>=3.2,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]
foundation = ["chronos-forecasting>=2.2,<3", "timesfm[torch]"]

[project.scripts]
fconcord = "fconcord.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
